<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px;}
.wrap{width:100%;max-width:420px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#fff;}
.title{font-size:22px;font-weight:700;letter-spacing:2px;}
.score-box{text-align:right;}
.score-box .label{font-size:12px;opacity:.7;}
.score-box .num{font-size:22px;font-weight:700;color:#ffd166;}
.stage{position:relative;background:#0a1929;border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);}
canvas{display:block;width:100%;background:#0a1929;border-radius:8px;touch-action:none;}
.bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.hint{color:#cfe8ff;font-size:13px;line-height:1.7;}
.btn{background:#ffd166;color:#14213d;border:none;padding:10px 22px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;}
.btn:active{transform:scale(.95);}
.overlay{position:absolute;inset:0;background:rgba(10,25,41,.88);border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;
  opacity:0;pointer-events:none;transition:opacity .25s;z-index:5;text-align:center;padding:20px;}
.overlay.show{opacity:1;pointer-events:auto;}
.overlay h2{font-size:26px;}
.overlay p{font-size:15px;color:#cfe8ff;line-height:1.8;}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,44px);gap:6px;margin:16px auto 0;width:max-content;}
.dpad button{border:none;border-radius:8px;font-size:20px;background:#1b3a57;color:#fff;cursor:pointer;line-height:1;}
.dpad button:active{background:#2c5364;}
.dpad .up{grid-column:2;grid-row:1;}
.dpad .left{grid-column:1;grid-row:2;}
.dpad .down{grid-column:2;grid-row:3;}
.dpad .right{grid-column:3;grid-row:2;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="title">🐍 贪吃蛇</div>
    <div class="score-box"><div class="label">得分</div><div class="num" id="score">0</div></div>
  </div>
  <div class="stage">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">🐍 贪吃蛇</h2>
      <p id="ovText">方向键 / WASD 或滑动屏幕控制移动<br>吃到食物 +10 分，撞墙或撞到自己则结束</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>
  <div class="bar">
    <div class="hint">方向键 / WASD / 滑动<br>空格键暂停</div>
    <button class="btn" id="restartBtn">重新开始</button>
  </div>
  <div class="dpad" id="dpad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="down" data-d="down">▼</button>
    <button class="right" data-d="right">▶</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  var canvas=document.getElementById('game');
  var ctx=canvas.getContext('2d');
  var scoreEl=document.getElementById('score');
  var overlay=document.getElementById('overlay');
  var ovTitle=document.getElementById('ovTitle');
  var ovText=document.getElementById('ovText');
  var startBtn=document.getElementById('startBtn');
  var restartBtn=document.getElementById('restartBtn');

  var N=20, CELL=canvas.width/N;
  var snake, dir, queue, food, score, timer, running, paused;

  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0};
    queue=[];
    score=0;
    scoreEl.textContent='0';
    spawnFood();
    running=false;
    paused=false;
  }

  function spawnFood(){
    var free=[];
    for(var y=0;y<N;y++){
      for(var x=0;x<N;x++){
        var hit=false;
        for(var i=0;i<snake.length;i++){
          if(snake[i].x===x&&snake[i].y===y){hit=true;break;}
        }
        if(!hit) free.push({x:x,y:y});
      }
    }
    if(free.length===0){ gameOver(true); return; }
    food=free[Math.floor(Math.random()*free.length)];
  }

  function step(){
    if(!running||paused) return;
    if(queue.length>0) dir=queue.shift();
    var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.x>=N||head.y<0||head.y>=N){ gameOver(false); return; }
    for(var i=0;i<snake.length;i++){
      if(snake[i].x===head.x&&snake[i].y===head.y){ gameOver(false); return; }
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10;
      scoreEl.textContent=score;
      spawnFood();
      restartTimer();
    } else {
      snake.pop();
    }
    draw();
  }

  function restartTimer(){
    if(timer) clearInterval(timer);
    var ms=Math.max(70, 200-score*2);
    timer=setInterval(step, ms);
  }

  function gameOver(won){
    running=false; paused=false;
    if(timer){ clearInterval(timer); timer=null; }
    overlay.classList.add('show');
    ovTitle.textContent= won ? '🎉 你赢了！' : '💥 游戏结束';
    ovText.innerHTML= won ? '蛇已占满整个画面' : '最终得分：<b>'+score+'</b><br>按空格或点击按钮再来一局';
  }

  function start(){
    reset();
    running=true; paused=false;
    overlay.classList.remove('show');
    restartTimer();
    draw();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.lineWidth=1;
    for(var i=1;i<N;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
    }
    if(food){
      ctx.fillStyle='#ff5d5d';
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.32, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL*0.62, food.y*CELL+CELL*0.38, CELL*0.09, 0, Math.PI*2);
      ctx.fill();
    }
    for(var j=snake.length-1;j>=0;j--){
      var s=snake[j];
      var pad=1;
      ctx.fillStyle= j===0 ? '#66ffb2' : '#2fd080';
      roundRect(s.x*CELL+pad, s.y*CELL+pad, CELL-pad*2, CELL-pad*2, 5);
      ctx.fill();
    }
    var h=snake[0];
    ctx.fillStyle='#0a1929';
    var ex=h.x*CELL+CELL/2+dir.x*4, ey=h.y*CELL+CELL/2+dir.y*4;
    ctx.beginPath(); ctx.arc(ex-5, ey-4, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex+5, ey-4, 2.2, 0, Math.PI*2); ctx.fill();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function setDir(d){
    if(!running||paused) return;
    var nd={x:0,y:0};
    if(d==='up') nd={x:0,y:-1};
    else if(d==='down') nd={x:0,y:1};
    else if(d==='left') nd={x:-1,y:0};
    else if(d==='right') nd={x:1,y:0};
    if(nd.x===0&&nd.y===0) return;
    var last=queue.length? queue[queue.length-1] : dir;
    if(last.x+nd.x===0 && last.y+nd.y===0) return;
    if(queue.length<2) queue.push(nd);
  }

  document.addEventListener('keydown', function(e){
    var k=e.key;
    if(k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); setDir('up'); }
    else if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); setDir('down'); }
    else if(k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); setDir('left'); }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); setDir('right'); }
    else if(k===' '){
      e.preventDefault();
      if(!running){ start(); return; }
      if(!paused){
        paused=true;
        clearInterval(timer);
        overlay.classList.add('show');
        ovTitle.textContent='⏸ 已暂停';
        ovText.textContent='按空格键继续游戏';
      } else {
        paused=false;
        overlay.classList.remove('show');
        restartTimer();
      }
    }
    else if(k==='Enter'){ if(!running||paused) start(); }
  });

  var tx=0, ty=0;
  canvas.addEventListener('touchstart', function(e){
    var t=e.touches[0]; tx=t.clientX; ty=t.clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    var t=e.changedTouches[0];
    var dx=t.clientX-tx, dy=t.clientY-ty;
    if(Math.abs(dx)<24 && Math.abs(dy)<24) return;
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'right':'left');
    else setDir(dy>0?'down':'up');
  }, {passive:true});

  var dpad=document.getElementById('dpad');
  dpad.addEventListener('click', function(e){
    var b=e.target.closest('button');
    if(!b) return;
    setDir(b.getAttribute('data-d'));
  });

  startBtn.addEventListener('click', start);
  restartBtn.addEventListener('click', start);

  reset();
  draw();
})();
</script>
</body>
</html>
